<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>
    Presensi Sholat XII MIA 2
  </title>


  <!-- =====================================================
       LIBRARY QR SCANNER
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>
    /* =====================================================
       PRESENSI SHOLAT XII MIA 2 — UI FINAL
       Mesin scanner/API tetap memakai JavaScript lama.
       ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #17351f;
      background:
        radial-gradient(circle at 8% 12%, rgba(205,164,67,.08), transparent 24%),
        radial-gradient(circle at 92% 32%, rgba(34,113,61,.08), transparent 26%),
        #f4f7f4;
    }

    body {
      padding-bottom: 24px;
    }

    button,
    select {
      font: inherit;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, #fffdf6 0%, #fbfaf1 62%, #f4f7ef 100%);
      min-height: 220px;
      padding: 28px 24px 25px;
      border-bottom: 1px solid rgba(184,145,48,.28);
      box-shadow: 0 8px 28px rgba(24,57,34,.08);
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .header::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      left: -120px;
      top: -145px;
      background:
        repeating-linear-gradient(
          135deg,
          rgba(28,104,57,.13) 0 2px,
          transparent 2px 12px
        );
      transform: rotate(20deg);
      border-radius: 42px;
      pointer-events: none;
    }

    .header::after {
      content: "☾";
      position: absolute;
      right: 25px;
      bottom: -25px;
      font-size: 160px;
      line-height: 1;
      color: rgba(38,111,61,.045);
      pointer-events: none;
    }

    .header-logo-wrap {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
    }

    .header-logo-wrap::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: rgba(255,255,255,.75);
      box-shadow: 0 8px 22px rgba(23,76,39,.10);
    }

    .school-logo {
      position: relative;
      z-index: 1;
      width: 150px;
      height: 150px;
      object-fit: contain;
      display: block;
    }

    .header-content {
      position: relative;
      z-index: 2;
      min-width: 0;
      padding-right: 50px;
    }

    .header h1 {
      margin: 0;
      color: #176235;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: .4px;
    }

    .header-school {
      margin-top: 10px;
      color: #1c6b3b;
      font-size: clamp(20px, 3.2vw, 34px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: .3px;
    }

    .header-class {
      display: inline-block;
      margin-top: 11px;
      color: #b27b12;
      font-size: clamp(17px, 2.5vw, 25px);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .header-divider {
      width: 330px;
      max-width: 100%;
      height: 2px;
      margin-top: 15px;
      background: linear-gradient(
        90deg,
        rgba(191,145,41,0),
        #c7962d 18%,
        #c7962d 82%,
        rgba(191,145,41,0)
      );
      position: relative;
    }

    .header-divider::after {
      content: "✦";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -52%);
      padding: 0 10px;
      color: #c7962d;
      background: #fbfaf1;
      font-size: 17px;
    }

    /* =====================================================
       CONTAINER & CARD
       ===================================================== */

    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px;
    }

    .card,
    .result {
      background: rgba(255,255,255,.97);
      border: 1px solid rgba(31,100,52,.08);
      border-radius: 22px;
      box-shadow: 0 7px 24px rgba(22,61,35,.08);
    }

    .card {
      padding: 22px;
      margin-bottom: 16px;
    }

    /* =====================================================
       SECTION TITLE
       ===================================================== */

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      color: #176235;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .2px;
    }

    .section-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8f3e9;
      color: #176235;
    }

    .section-icon svg {
      width: 25px;
      height: 25px;
    }

    /* =====================================================
       CAMERA
       ===================================================== */

    .camera-card {
      padding: 22px;
    }

    .camera-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .camera-heading-left {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #176235;
      font-size: 22px;
      font-weight: 900;
    }

    .qr-icon {
      width: 40px;
      height: 40px;
      color: #176235;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eaf7ed;
      color: #176235;
      border: 1px solid #b9dfc0;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #20a64a;
      box-shadow: 0 0 0 4px rgba(32,166,74,.10);
    }

    #reader {
      width: 100%;
      min-height: 310px;
      overflow: hidden;
      border-radius: 18px;
      background: #101614;
      border: 1px solid rgba(23,98,53,.20);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      min-height: 310px;
      object-fit: cover;
    }

    #reader__dashboard,
    #reader__status_span {
      font-family: Arial, Helvetica, sans-serif !important;
    }

    .camera-status {
      margin-top: 13px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 16px;
      border-radius: 16px;
      background: #edf7ef;
      color: #356047;
      font-size: 16px;
      line-height: 1.4;
    }

    .camera-status::before {
      content: "●";
      color: #18a343;
      font-size: 22px;
      line-height: 1;
    }

    /* =====================================================
       SESSION
       ===================================================== */

    .session-title {
      margin-bottom: 15px;
    }

    .session-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .session-option {
      position: relative;
      cursor: pointer;
    }

    .session-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .session-card {
      min-height: 130px;
      padding: 17px;
      border: 2px solid #dce7de;
      border-radius: 18px;
      background: #fafcf9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: .16s ease;
      user-select: none;
    }

    .session-visual {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
    }

    .session-text {
      min-width: 0;
    }

    .session-name {
      color: #176235;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: .5px;
      line-height: 1.05;
    }

    .session-subtitle {
      margin-top: 7px;
      color: #475569;
      font-size: 15px;
    }

    .session-option.ashar .session-name {
      color: #bc8514;
    }

    .session-option.ashar .session-card {
      border-color: #ead9a7;
      background: #fffdf7;
    }

    .session-option input:checked + .session-card {
      border-color: #62a972;
      background: #f0f8f1;
      box-shadow: 0 6px 18px rgba(39,113,61,.12);
      transform: translateY(-1px);
    }

    .session-option.ashar input:checked + .session-card {
      border-color: #d9a631;
      background: #fff9ea;
      box-shadow: 0 6px 18px rgba(180,126,20,.12);
    }

    .session-option input:focus-visible + .session-card {
      outline: 3px solid rgba(37,99,235,.20);
      outline-offset: 2px;
    }

    #sesi {
      display: none;
    }

    .session-helper {
      text-align: center;
      margin-top: 10px;
      color: #64748b;
      font-size: 13px;
    }

    /* =====================================================
       BUTTON
       ===================================================== */

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 14px;
      margin-top: 13px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    button:active:not(:disabled) {
      transform: scale(.99);
    }

    .btn-start {
      background: #176235;
      color: white;
      box-shadow: 0 6px 16px rgba(23,98,53,.18);
    }

    .btn-stop {
      background: #e8eee9;
      color: #17351f;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* =====================================================
       HASIL SCAN
       ===================================================== */

    .result {
      display: none;
      text-align: center;
      padding: 25px 18px;
      margin-bottom: 16px;
    }

    .result.processing {
      display: block;
      background: #eef8fc;
      border-color: #a8dcef;
    }

    .result.success {
      display: block;
      background: #eff9f1;
      border-color: #9bd6a6;
    }

    .result.warning {
      display: block;
      background: #fff9e8;
      border-color: #e8c76d;
    }

    .result.error {
      display: block;
      background: #fff1f1;
      border-color: #efb1b1;
    }

    .result-status {
      font-size: 29px;
      font-weight: 900;
      margin-bottom: 9px;
    }

    .result-name {
      color: #17351f;
      font-size: clamp(24px, 5vw, 36px);
      font-weight: 900;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .result-detail {
      margin-top: 10px;
      font-size: 15px;
      line-height: 1.6;
      color: #475569;
    }

    /* =====================================================
       SPINNER
       ===================================================== */

    .spinner {
      width: 28px;
      height: 28px;
      border: 4px solid #b9e0ed;
      border-top-color: #1981a9;
      border-radius: 50%;
      margin: 0 auto 10px;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =====================================================
       RIWAYAT
       ===================================================== */

    .history-title {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #176235;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .history-title::before {
      content: "◷";
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e8f3e9;
      font-size: 28px;
      line-height: 1;
    }

    .history-empty {
      color: #64748b;
      text-align: center;
      padding: 20px 12px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #e4ece6;
    }

    .history-item:last-child {
      border-bottom: 0;
    }

    .history-number {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e7f0e9;
      color: #176235;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-name {
      color: #13241a;
      font-size: 17px;
      font-weight: 900;
      overflow-wrap: anywhere;
      line-height: 1.2;
    }

    .history-detail {
      font-size: 14px;
      color: #64748b;
      margin-top: 5px;
      line-height: 1.4;
    }

    .history-status {
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
      color: #176235;
      padding: 8px 13px;
      border-radius: 999px;
      background: #eaf7ed;
      border: 1px solid #b9dfc0;
    }

    /* =====================================================
       FOOTER INFO
       ===================================================== */

    .info {
      margin: 8px 0 0;
      padding: 18px 16px;
      border-radius: 18px;
      background: #edf6ef;
      color: #356047;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid #d3e7d7;
    }

    .info strong {
      display: block;
      color: #176235;
      font-size: 16px;
      margin-bottom: 2px;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 700px) {
      .header {
        min-height: 190px;
        padding: 22px 18px;
        gap: 17px;
      }

      .header-logo-wrap,
      .school-logo {
        width: 105px;
        height: 105px;
      }

      .header-logo-wrap {
        flex-basis: 105px;
      }

      .header-content {
        padding-right: 10px;
      }

      .header-divider {
        margin-top: 11px;
      }

      .container {
        padding: 13px;
      }

      .card {
        padding: 17px;
        border-radius: 19px;
      }

      .camera-card {
        padding: 17px;
      }

      #reader,
      #reader video {
        min-height: 270px;
      }

      .session-card {
        min-height: 112px;
        gap: 10px;
      }

      .session-visual {
        width: 55px;
        height: 55px;
        flex-basis: 55px;
      }

      .session-name {
        font-size: 22px;
      }

      .session-subtitle {
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      .header {
        min-height: 175px;
        align-items: center;
        padding: 18px 13px;
        gap: 12px;
      }

      .header-logo-wrap,
      .school-logo {
        width: 83px;
        height: 83px;
      }

      .header-logo-wrap {
        flex-basis: 83px;
      }

      .header-logo-wrap::before {
        inset: -5px;
      }

      .header h1 {
        font-size: 25px;
      }

      .header-school {
        margin-top: 6px;
        font-size: 17px;
      }

      .header-class {
        margin-top: 6px;
        font-size: 15px;
      }

      .header-divider {
        margin-top: 9px;
      }

      .header::after {
        font-size: 100px;
      }

      .camera-heading-left,
      .section-title,
      .history-title {
        font-size: 18px;
      }

      .live-badge {
        font-size: 10px;
        padding: 6px 8px;
      }

      #reader,
      #reader video {
        min-height: 250px;
      }

      .session-grid {
        gap: 8px;
      }

      .session-card {
        min-height: 100px;
        padding: 10px 6px;
        flex-direction: column;
        gap: 7px;
        text-align: center;
      }

      .session-visual {
        width: 47px;
        height: 47px;
        flex-basis: 47px;
      }

      .session-name {
        font-size: 19px;
      }

      .session-subtitle {
        font-size: 12px;
      }

      .history-item {
        gap: 9px;
      }

      .history-number {
        width: 36px;
        height: 36px;
      }

      .history-name {
        font-size: 15px;
      }

      .history-detail {
        font-size: 12px;
      }

      .history-status {
        font-size: 11px;
        padding: 7px 9px;
      }
    }
  </style>

</head>


<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="header">

    <div class="header-logo-wrap">
      <img
        class="school-logo"
        src="logo-sekolah.webp"
        alt="Logo SMAN 1 Muara Uya"
        width="150"
        height="150"
      >
    </div>

    <div class="header-content">
      <h1>PRESENSI SHOLAT</h1>
      <div class="header-school">SMAN 1 MUARA UYA</div>
      <div class="header-class">Kelas XII MIA 2</div>
      <div class="header-divider"></div>
    </div>

  </header>


  <main class="container">


    <!-- ===================================================
         PILIH SESI
         =================================================== -->

    <section class="card">

      <div class="section-title session-title">
        <span class="section-icon">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path fill="currentColor" d="M32 5c-8 9-14 16-14 26a14 14 0 0 0 28 0c0-10-6-17-14-26Zm0 47c-8 0-12-5-12-11 0-4 2-8 5-12 1 7 4 10 7 12 3-2 6-5 7-12 3 4 5 8 5 12 0 6-4 11-12 11Z"/>
          </svg>
        </span>
        PILIH SESI SHOLAT
      </div>

      <select id="sesi" aria-hidden="true" tabindex="-1">
        <option value="DZUHUR">DZUHUR</option>
        <option value="ASHAR">ASHAR</option>
      </select>

      <div class="session-grid">

        <label class="session-option dzuhur">
          <input
            type="radio"
            name="sessionChoice"
            value="DZUHUR"
            checked
            onchange="changeSessionVisual(this.value)"
          >

          <div class="session-card">

            <svg
              class="session-visual"
              viewBox="0 0 100 100"
              aria-hidden="true"
            >
              <circle cx="50" cy="27" r="13" fill="#2b8a4a"/>
              <path fill="#176235" d="M17 73h66v9H17zM25 73V51l25-20 25 20v22H64V57H36v16H25Zm25-48 4 4h-8l4-4Zm-34 48 9-6h50l9 6v7H16v-7Z"/>
              <path fill="#2b8a4a" d="M46 42h8v31h-8zM42 42h16l-8-9-8 9Z"/>
              <circle cx="50" cy="12" r="3" fill="#176235"/>
            </svg>

            <div class="session-text">
              <div class="session-name">DZUHUR</div>
              <div class="session-subtitle">Waktu Dzuhur</div>
            </div>

          </div>
        </label>


        <label class="session-option ashar">
          <input
            type="radio"
            name="sessionChoice"
            value="ASHAR"
            onchange="changeSessionVisual(this.value)"
          >

          <div class="session-card">

            <svg
              class="session-visual"
              viewBox="0 0 100 100"
              aria-hidden="true"
            >
              <path fill="#c79316" d="M65 14c-13 2-23 12-23 26 0 15 12 27 27 27 8 0 16-4 21-10-3 1-6 2-10 2-15 0-27-12-27-27 0-7 3-14 8-18-1 0-2 0-3 0Z"/>
              <path fill="#b47d0e" d="M17 77h66v8H17zM25 77V55l25-20 25 20v22H64V61H36v16H25Zm25-48 4 4h-8l4-4Zm-34 48 9-6h50l9 6v7H16v-7Z"/>
              <path fill="#c79316" d="M46 45h8v32h-8zM42 45h16l-8-9-8 9Z"/>
            </svg>

            <div class="session-text">
              <div class="session-name">ASHAR</div>
              <div class="session-subtitle">Waktu Ashar</div>
            </div>

          </div>
        </label>

      </div>

      <div class="session-helper">
        Pilih sesi sebelum melakukan scan.
      </div>

      <button
        id="startButton"
        class="btn-start"
        onclick="startScanner()"
      >
        📷 MULAI KAMERA
      </button>

      <button
        id="stopButton"
        class="btn-stop"
        onclick="stopScanner()"
        disabled
      >
        ⏹ BERHENTI
      </button>

    </section>


    <!-- ===================================================
         CAMERA
         =================================================== -->

    <section class="card camera-card">

      <div class="camera-heading">

        <div class="camera-heading-left">

          <svg
            class="qr-icon"
            viewBox="0 0 64 64"
            aria-hidden="true"
          >
            <path fill="currentColor" d="M7 7h20v20H7V7Zm5 5v10h10V12H12Zm5 3h4v4h-4v-4ZM37 7h20v20H37V7Zm5 5v10h10V12H42Zm5 3h4v4h-4v-4ZM7 37h20v20H7V37Zm5 5v10h10V42H12Zm5 3h4v4h-4v-4ZM37 37h7v7h-7v-7Zm10 0h10v10H47V37Zm-10 12h7v8h-7v-8Zm12 0h5v8h-5v-8Z"/>
          </svg>

          <span>SCAN QR CODE SISWA</span>

        </div>

        <div class="live-badge">
          <span class="live-dot"></span>
          LIVE
        </div>

      </div>

      <div id="reader"></div>

      <div id="cameraStatus" class="camera-status">
        Kamera belum dimulai.
      </div>

    </section>


    <!-- ===================================================
         HASIL SCAN TERAKHIR
         =================================================== -->

    <section
      id="result"
      class="result"
    >

      <div
        id="resultStatus"
        class="result-status"
      ></div>


      <div
        id="resultName"
        class="result-name"
      ></div>


      <div
        id="resultDetail"
        class="result-detail"
      ></div>

    </section>


    <!-- ===================================================
         RIWAYAT
         =================================================== -->

    <section class="card">

      <div class="history-title">
        RIWAYAT TERAKHIR
      </div>


      <div id="history">

        <div class="history-empty">
          Belum ada scan.
        </div>

      </div>

    </section>


    <div class="info">
      <strong>🛡️ Sistem Presensi Sholat</strong>
      XII MIA 2 · SMAN 1 MUARA UYA<br>
      Kamera tetap aktif selama proses presensi.
    </div>


  </main>


  <script>


    // =====================================================
    // URL APPS SCRIPT
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzdYWzw0WAKHSfkwiOEiCppd2KLl2pmWoSFkyzSIhEOaRiKlEapUsC_RU3IWH8efnC_Zg/exec";


    // =====================================================
    // KONFIGURASI SCANNER
    // =====================================================

    const CAMERA_FPS = 15;

    const QR_BOX_SIZE = 250;


    // =====================================================
    // DATA 31 SISWA
    // =====================================================

    const STUDENTS = {

      "MIA2-001":
        "AFRIA DIKKY HIDAYAT",

      "MIA2-002":
        "AHMAD PIANOR",

      "MIA2-003":
        "ALDI SAPUTRA",

      "MIA2-004":
        "DEWI ARIANTI",

      "MIA2-005":
        "DINAR NAZARIA PUTERI",

      "MIA2-006":
        "DZAKIRA IFTINAH ZALFA",

      "MIA2-007":
        "EKA PUTRI KHOLIFIA",

      "MIA2-008":
        "HASBILAH",

      "MIA2-009":
        "HUSNUL ASHFIA",

      "MIA2-010":
        "JUMIATUN NIRMALA",

      "MIA2-011":
        "KEYZA PUTRI RAMADHANI",

      "MIA2-012":
        "LUTHFI NUR AHMADI A",

      "MIA2-013":
        "MAHMUDAH",

      "MIA2-014":
        "MARDIANA",

      "MIA2-015":
        "MARSHALINA",

      "MIA2-016":
        "MUHAMMAD FADHIL AL LAIL",

      "MIA2-017":
        "MUHAMMAD MARVEL",

      "MIA2-018":
        "NAFISA ADDAWIYAH",

      "MIA2-019":
        "NENG KHOIRIYA RAMADHANI",

      "MIA2-020":
        "NOOR SYIFA",

      "MIA2-021":
        "NOR ANISSA",

      "MIA2-022":
        "NOVIKA MARDIANA",

      "MIA2-023":
        "RAFFI AKHMAD",

      "MIA2-024":
        "RIFA ALYA MAYYADAH",

      "MIA2-025":
        "RIHHADATUL AISYAH",

      "MIA2-026":
        "SALEHAH",

      "MIA2-027":
        "SHEPYA NOVITA DILA RESTU",

      "MIA2-028":
        "SITI UMROH NUR HAYATI",

      "MIA2-029":
        "TASYA NOR AZIZAH",

      "MIA2-030":
        "YUSUF AL AMIEN",

      "MIA2-031":
        "ZAHRATUSSYIFA"

    };


    // =====================================================
    // VARIABEL
    // =====================================================

    let scanner = null;

    let scannerRunning = false;


    // =====================================================
    // KUNCI PRESENSI
    //
    // Format:
    //
    // DZUHUR|MIA2-001
    // ASHAR|MIA2-001
    //
    // Jadi DZUHUR dan ASHAR terpisah.
    // =====================================================

    const completedKeys =
      new Set();


    // =====================================================
    // REQUEST YANG SEDANG BERJALAN
    // =====================================================

    const pendingKeys =
      new Set();


    // =====================================================
    // RIWAYAT
    // =====================================================

    let historyData = [];


    // =====================================================
    // AUDIO
    // =====================================================

    let audioContext = null;


    // =====================================================
    // HASIL TIMER
    // =====================================================

    let resultTimer = null;


    // =====================================================
    // SESSION TERAKHIR
    // =====================================================

    let sesiSebelumnya =
      document
        .getElementById("sesi")
        .value;


    // =====================================================
    // PREPARE AUDIO
    // =====================================================

    function prepareAudio() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }

      }

      catch (error) {

        console.log(
          "Audio tidak tersedia:",
          error
        );

      }

    }


    // =====================================================
    // BEEP
    // =====================================================

    function beep() {

      try {

        if (!audioContext) {

          prepareAudio();

        }


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.type =
          "sine";


        oscillator.frequency.value =
          880;


        gain.gain.value =
          0.15;


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.start();


        setTimeout(

          () => {

            oscillator.stop();

          },

          120

        );

      }

      catch (error) {

        console.log(
          "Beep gagal:",
          error
        );

      }

    }


    // =====================================================
    // MULAI SCANNER
    // =====================================================

    async function startScanner() {

      prepareAudio();


      if (scannerRunning) {

        return;

      }


      const cameraStatus =
        document
          .getElementById(
            "cameraStatus"
          );


      try {

        cameraStatus.textContent =
          "Memulai kamera...";


        scanner =
          new Html5Qrcode(
            "reader"
          );


        const config = {

          fps:
            CAMERA_FPS,

          qrbox: {

            width:
              QR_BOX_SIZE,

            height:
              QR_BOX_SIZE

          },

          aspectRatio:
            1.0,

          disableFlip:
            true

        };


        await scanner.start(

          {
            facingMode:
              "environment"
          },

          config,

          onScanSuccess,

          onScanFailure

        );


        scannerRunning =
          true;


        document
          .getElementById(
            "startButton"
          )
          .disabled = true;


        document
          .getElementById(
            "stopButton"
          )
          .disabled = false;


        cameraStatus.textContent =
          "🟢 Kamera aktif — arahkan ke QR siswa.";

      }

      catch (error) {

        console.error(
          "Kamera gagal:",
          error
        );


        scannerRunning =
          false;


        cameraStatus.textContent =
          "🔴 Kamera tidak dapat digunakan.";


        showResult(

          "error",

          "✕ KAMERA GAGAL",

          "",

          "Pastikan izin kamera diberikan kepada browser."

        );

      }

    }


    // =====================================================
    // STOP SCANNER
    // =====================================================

    async function stopScanner() {

      if (!scanner) {

        return;

      }


      try {

        await scanner.stop();

        scanner.clear();

      }

      catch (error) {

        console.log(
          "Stop scanner:",
          error
        );

      }


      scanner =
        null;


      scannerRunning =
        false;


      document
        .getElementById(
          "startButton"
        )
        .disabled = false;


      document
        .getElementById(
          "stopButton"
        )
        .disabled = true;


      document
        .getElementById(
          "cameraStatus"
        )
        .textContent =
        "Kamera berhenti.";

    }


    // =====================================================
    // QR BERHASIL DIBACA
    // =====================================================

    function onScanSuccess(

      decodedText,
      decodedResult

    ) {

      const idSiswa =
        String(
          decodedText || ""
        )
          .trim()
          .toUpperCase();


      if (!idSiswa) {

        return;

      }


      // ===================================================
      // PASTIKAN ID TERDAFTAR DI DATABASE LOKAL
      // ===================================================

      const nama =
        STUDENTS[idSiswa];


      if (!nama) {

        handleUnknownQR(
          idSiswa
        );

        return;

      }


      const sesi =
        document
          .getElementById(
            "sesi"
          )
          .value;


      const key =
        sesi +
        "|" +
        idSiswa;


      // ===================================================
      // SUDAH SELESAI / SUDAH DIPROSES
      // ===================================================

      if (
        completedKeys.has(
          key
        )
      ) {

        return;

      }


      // ===================================================
      // MASIH MENUNGGU SERVER
      // ===================================================

      if (
        pendingKeys.has(
          key
        )
      ) {

        return;

      }


      // ===================================================
      // KUNCI REQUEST
      // ===================================================

      pendingKeys.add(
        key
      );


      // ===================================================
      // BEEP SEGERA
      // =====================================================

      beep();


      // ===================================================
      // TAMPILKAN NAMA SEGERA
      // ===================================================

      showResult(

        "processing",

        "⏳ MENCATAT...",

        nama,

        `
          ID: ${idSiswa}<br>
          Sesi: ${sesi}<br>
          QR terbaca — mengirim ke server...
        `

      );


      // ===================================================
      // MASUKKAN KE RIWAYAT SEGERA
      // ===================================================

      const historyId =
        addHistory(

          nama,

          idSiswa,

          sesi,

          "Mencatat...",

          "MENCATAT"

        );


      // ===================================================
      // KIRIM KE APPS SCRIPT
      // ===================================================

      kirimPresensi(

        idSiswa,

        sesi,

        key,

        historyId

      );

    }


    // =====================================================
    // QR TIDAK DIKENAL
    // =====================================================

    let unknownLock =
      new Set();


    function handleUnknownQR(
      idSiswa
    ) {

      if (
        unknownLock.has(
          idSiswa
        )
      ) {

        return;

      }


      unknownLock.add(
        idSiswa
      );


      beep();


      showResult(

        "error",

        "✕ QR TIDAK TERDAFTAR",

        idSiswa,

        "QR ini tidak ditemukan dalam daftar 31 siswa."

      );


      setTimeout(

        () => {

          unknownLock.delete(
            idSiswa
          );

        },

        3000

      );

    }


    // =====================================================
    // SCAN FAILURE
    // =====================================================

    function onScanFailure(
      errorMessage
    ) {

      // Sengaja dikosongkan.
      //
      // Scanner terus mencoba membaca
      // frame kamera berikutnya.

    }


    // =====================================================
    // KIRIM PRESENSI
    // =====================================================

    async function kirimPresensi(

      idSiswa,

      sesi,

      key,

      historyId

    ) {

      try {

        const response =
          await fetch(

            API_URL,

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  idSiswa:
                    idSiswa,

                  sesi:
                    sesi

                })

            }

          );


        const result =
          await response.json();


        console.log(
          "API RESPONSE:",
          result
        );


        // =================================================
        // BERHASIL HADIR
        // =================================================

        if (

          result.success ===
            true &&

          result.code ===
            "SUCCESS"

        ) {

          completedKeys.add(
            key
          );


          updateHistory(

            historyId,

            result.nama,

            result.idSiswa,

            result.sesi,

            result.waktu,

            "HADIR"

          );


          showResult(

            "success",

            "✓ HADIR",

            result.nama,

            `
              ID: ${result.idSiswa}<br>
              Sesi: ${result.sesi}<br>
              Waktu: ${result.waktu}
            `

          );


          return;

        }


        // =================================================
        // SUDAH PRESENSI
        // =================================================

        if (

          result.code ===
          "ALREADY_PRESENT"

        ) {

          completedKeys.add(
            key
          );


          updateHistory(

            historyId,

            result.nama,

            result.idSiswa,

            result.sesi,

            result.waktu,

            "SUDAH"

          );


          showResult(

            "warning",

            "⚠ SUDAH PRESENSI",

            result.nama,

            `
              ID: ${result.idSiswa}<br>
              Sesi: ${result.sesi}<br>
              Sudah tercatat pukul:
              ${result.waktu}
            `

          );


          return;

        }


        // =================================================
        // TIDAK TERDAFTAR DI SERVER
        // =================================================

        if (

          result.code ===
          "NOT_REGISTERED"

        ) {

          updateHistory(

            historyId,

            "QR tidak terdaftar",

            idSiswa,

            sesi,

            "-",

            "DITOLAK"

          );


          showResult(

            "error",

            "✕ QR TIDAK TERDAFTAR",

            idSiswa,

            "Server tidak menemukan ID siswa tersebut."

          );


          return;

        }


        // =================================================
        // SISWA TIDAK AKTIF
        // =================================================

        if (

          result.code ===
          "INACTIVE"

        ) {

          updateHistory(

            historyId,

            result.nama ||
              STUDENTS[idSiswa],

            idSiswa,

            sesi,

            "-",

            "DITOLAK"

          );


          showResult(

            "error",

            "✕ SISWA TIDAK AKTIF",

            result.nama ||
              STUDENTS[idSiswa],

            `
              ID:
              ${idSiswa}
            `

          );


          return;

        }


        // =================================================
        // ERROR LAIN
        // =================================================

        updateHistory(

          historyId,

          STUDENTS[idSiswa],

          idSiswa,

          sesi,

          "-",

          "ERROR"

        );


        showResult(

          "error",

          "✕ TERJADI KESALAHAN",

          STUDENTS[idSiswa],

          result.message ||
          "Server memberikan respons yang tidak dikenali."

        );

      }


      catch (error) {

        console.error(
          "API ERROR:",
          error
        );


        // ================================================
        // HAPUS LOCK
        //
        // Karena gagal, siswa boleh dicoba lagi.
        // ================================================

        updateHistory(

          historyId,

          STUDENTS[idSiswa],

          idSiswa,

          sesi,

          "-",

          "GAGAL"

        );


        showResult(

          "error",

          "✕ KONEKSI GAGAL",

          STUDENTS[idSiswa],

          `
            Data belum dapat dikonfirmasi
            oleh server.<br>
            Silakan scan ulang.
          `

        );

      }


      finally {

        // =================================================
        // REQUEST SELESAI
        // =================================================

        pendingKeys.delete(
          key
        );

      }

    }


    // =====================================================
    // HASIL SCAN
    // =====================================================

    function showResult(

      type,

      status,

      name,

      detail

    ) {

      const result =
        document
          .getElementById(
            "result"
          );


      const resultStatus =
        document
          .getElementById(
            "resultStatus"
          );


      const resultName =
        document
          .getElementById(
            "resultName"
          );


      const resultDetail =
        document
          .getElementById(
            "resultDetail"
          );


      result.className =
        "result " +
        type;


      resultStatus.textContent =
        status;


      resultName.textContent =
        name;


      resultDetail.innerHTML =
        detail;


      result.style.display =
        "block";


      clearTimeout(
        resultTimer
      );


      resultTimer =
        setTimeout(

          () => {

            result.style.display =
              "none";

          },

          5000

        );

    }


    // =====================================================
    // TAMBAH RIWAYAT
    // =====================================================

    function addHistory(

      nama,

      id,

      sesi,

      waktu,

      status

    ) {

      const item = {

        idHistory:
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2),

        nama:
          nama,

        id:
          id,

        sesi:
          sesi,

        waktu:
          waktu,

        status:
          status

      };


      historyData.unshift(
        item
      );


      if (
        historyData.length >
        10
      ) {

        historyData =
          historyData.slice(
            0,
            10
          );

      }


      renderHistory();


      return item.idHistory;

    }


    // =====================================================
    // UPDATE RIWAYAT
    // =====================================================

    function updateHistory(

      historyId,

      nama,

      id,

      sesi,

      waktu,

      status

    ) {

      const item =
        historyData.find(

          x =>
            x.idHistory ===
            historyId

        );


      if (!item) {

        return;

      }


      item.nama =
        nama;

      item.id =
        id;

      item.sesi =
        sesi;

      item.waktu =
        waktu;

      item.status =
        status;


      renderHistory();

    }


    // =====================================================
    // RENDER RIWAYAT
    // =====================================================

    function renderHistory() {

      const container =
        document
          .getElementById(
            "history"
          );


      if (
        historyData.length ===
        0
      ) {

        container.innerHTML = `

          <div class="history-empty">

            Belum ada scan.

          </div>

        `;

        return;

      }


      container.innerHTML =
        historyData
          .map(

            (item, index) => {

              return `

                <div
                  class="history-item"
                >

                  <div
                    class="history-number"
                  >

                    ${index + 1}

                  </div>


                  <div
                    class="history-info"
                  >

                    <div
                      class="history-name"
                    >

                      ${escapeHtml(
                        item.nama
                      )}

                    </div>


                    <div
                      class="history-detail"
                    >

                      ${escapeHtml(
                        item.id
                      )}

                      ·

                      ${escapeHtml(
                        item.sesi
                      )}

                      ·

                      ${escapeHtml(
                        item.waktu
                      )}

                    </div>

                  </div>


                  <div
                    class="history-status"
                  >

                    ${escapeHtml(
                      item.status
                    )}

                  </div>

                </div>

              `;

            }

          )
          .join("");

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text == null
          ? ""
          : String(text);


      return div.innerHTML;

    }


    // =====================================================
    // PILIH SESI VISUAL
    // =====================================================

    function changeSessionVisual(value) {

      const select = document.getElementById("sesi");

      if (!select) {
        return;
      }

      if (scannerRunning) {

        alert(
          "Hentikan kamera terlebih dahulu sebelum mengganti sesi."
        );

        const current =
          sesiSebelumnya || select.value;

        select.value = current;

        const radio =
          document.querySelector(
            'input[name="sessionChoice"][value="' +
            current +
            '"]'
          );

        if (radio) {
          radio.checked = true;
        }

        return;
      }

      select.value = value;
      sesiSebelumnya = value;

    }


    // =====================================================
    // GANTI SESI
    // =====================================================

    document
      .getElementById(
        "sesi"
      )
      .addEventListener(

        "change",

        function () {

          if (
            scannerRunning
          ) {

            alert(
              "Hentikan kamera terlebih dahulu sebelum mengganti sesi."
            );


            this.value =
              sesiSebelumnya;


            return;

          }


          sesiSebelumnya =
            this.value;

          const radio =
            document.querySelector(
              'input[name="sessionChoice"][value="' +
              this.value +
              '"]'
            );

          if (radio) {
            radio.checked = true;
          }

        }

      );


  </script>
