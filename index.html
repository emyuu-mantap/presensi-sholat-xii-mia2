<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Presensi Sholat XII MIA 2</title>


  <!-- =================================================
       QR SCANNER
       ================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f5f9;
      color: #0f172a;

    }


    body {
      padding-bottom: 30px;
    }


    /* =================================================
       HEADER
       ================================================= */

    .header {

      background: #0f172a;
      color: white;

      padding: 18px 16px;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 23px;

      font-weight: 800;

    }


    .header p {

      margin: 6px 0 0;

      font-size: 15px;

      opacity: 0.85;

    }


    /* =================================================
       CONTAINER
       ================================================= */

    .container {

      width: 100%;
      max-width: 650px;

      margin: 0 auto;

      padding: 14px;

    }


    /* =================================================
       CARD
       ================================================= */

    .card {

      background: white;

      border-radius: 18px;

      padding: 16px;

      margin-bottom: 14px;

      box-shadow:
        0 4px 18px rgba(0, 0, 0, 0.07);

    }


    /* =================================================
       LABEL
       ================================================= */

    label {

      display: block;

      font-weight: 700;

      margin-bottom: 8px;

    }


    /* =================================================
       SELECT SESI
       ================================================= */

    select {

      width: 100%;

      height: 50px;

      border:
        1px solid #cbd5e1;

      border-radius: 12px;

      background: white;

      padding: 0 14px;

      font-size: 17px;

      font-weight: 700;

      color: #0f172a;

    }


    /* =================================================
       BUTTON
       ================================================= */

    button {

      width: 100%;

      height: 50px;

      border: 0;

      border-radius: 12px;

      margin-top: 12px;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

    }


    .btn-start {

      background: #2563eb;

      color: white;

    }


    .btn-stop {

      background: #e2e8f0;

      color: #0f172a;

    }


    button:disabled {

      opacity: 0.55;

      cursor: not-allowed;

    }


    /* =================================================
       CAMERA
       ================================================= */

    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 16px;

      background: #000;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      object-fit: cover;

    }


    /* =================================================
       CAMERA STATUS
       ================================================= */

    .camera-status {

      margin-top: 10px;

      text-align: center;

      font-size: 14px;

      color: #64748b;

    }


    /* =================================================
       HASIL
       ================================================= */

    .result {

      display: none;

      text-align: center;

      border-radius: 18px;

      padding: 22px 16px;

      margin-top: 14px;

    }


    .result.success {

      display: block;

      background: #dcfce7;

      border: 2px solid #86efac;

    }


    .result.warning {

      display: block;

      background: #fef3c7;

      border: 2px solid #fcd34d;

    }


    .result.error {

      display: block;

      background: #fee2e2;

      border: 2px solid #fca5a5;

    }


    .result.processing {

      display: block;

      background: #e0f2fe;

      border: 2px solid #7dd3fc;

    }


    .result-status {

      font-size: 28px;

      font-weight: 900;

      margin-bottom: 10px;

    }


    .result-name {

      font-size: 26px;

      font-weight: 900;

      line-height: 1.2;

      overflow-wrap: anywhere;

    }


    .result-detail {

      margin-top: 10px;

      font-size: 15px;

      line-height: 1.6;

      color: #334155;

    }


    /* =================================================
       LOADING
       ================================================= */

    .spinner {

      width: 28px;

      height: 28px;

      border: 4px solid #bae6fd;

      border-top-color: #0284c7;

      border-radius: 50%;

      margin: 0 auto 10px;

      animation:
        spin 0.8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =================================================
       RIWAYAT
       ================================================= */

    .history-title {

      font-size: 18px;

      font-weight: 900;

      margin-bottom: 10px;

    }


    .history-empty {

      color: #64748b;

      text-align: center;

      padding: 12px;

    }


    .history-item {

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 11px 0;

      border-bottom:
        1px solid #e2e8f0;

    }


    .history-item:last-child {

      border-bottom: 0;

    }


    .history-number {

      width: 30px;

      height: 30px;

      border-radius: 50%;

      background: #e2e8f0;

      display: flex;

      align-items: center;

      justify-content: center;

      font-weight: 800;

      flex-shrink: 0;

    }


    .history-info {

      flex: 1;

      min-width: 0;

    }


    .history-name {

      font-weight: 800;

      overflow-wrap: anywhere;

    }


    .history-detail {

      font-size: 13px;

      color: #64748b;

      margin-top: 3px;

    }


    .history-status {

      font-size: 12px;

      font-weight: 900;

      white-space: nowrap;

    }


    /* =================================================
       INFO
       ================================================= */

    .info {

      font-size: 13px;

      line-height: 1.6;

      color: #64748b;

      text-align: center;

    }

  </style>

</head>


<body>


  <!-- =================================================
       HEADER
       ================================================= -->

  <header class="header">

    <h1>
      Presensi Sholat
    </h1>

    <p>
      Kelas XII MIA 2
    </p>

  </header>


  <main class="container">


    <!-- =================================================
         PENGATURAN
         ================================================= -->

    <section class="card">

      <label for="sesi">
        Sesi Presensi
      </label>


      <select id="sesi">

        <option value="DZUHUR">
          DZUHUR
        </option>

        <option value="ASHAR">
          ASHAR
        </option>

      </select>


      <button
        id="startButton"
        class="btn-start"
        onclick="startScanner()"
      >

        📷 MULAI KAMERA

      </button>


      <button
        id="stopButton"
        class="btn-stop"
        onclick="stopScanner()"
        disabled
      >

        ⏹ BERHENTI

      </button>

    </section>


    <!-- =================================================
         CAMERA
         ================================================= -->

    <section class="card">

      <div id="reader"></div>


      <div
        id="cameraStatus"
        class="camera-status"
      >

        Kamera belum dimulai.

      </div>

    </section>


    <!-- =================================================
         HASIL
         ================================================= -->

    <section
      id="result"
      class="result"
    >

      <div
        id="resultStatus"
        class="result-status"
      ></div>


      <div
        id="resultName"
        class="result-name"
      ></div>


      <div
        id="resultDetail"
        class="result-detail"
      ></div>

    </section>


    <!-- =================================================
         RIWAYAT
         ================================================= -->

    <section class="card">

      <div class="history-title">
        Riwayat Scan
      </div>


      <div id="history">

        <div class="history-empty">
          Belum ada scan.
        </div>

      </div>

    </section>


    <div class="info">

      Kamera tetap aktif setelah QR terbaca.<br>

      QR yang sedang diproses
      tidak akan dikirim ulang.

    </div>


  </main>


  <script>


    // =================================================
    // API
    // =================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzdYWzw0WAKHSfkwiOEiCppd2KLl2pmWoSFkyzSIhEOaRiKlEapUsC_RU3IWH8efnC_Zg/exec";


    // =================================================
    // KONFIGURASI SCANNER
    // =================================================

    const CAMERA_FPS = 15;

    const QR_BOX_SIZE = 250;


    // =================================================
    // VARIABEL SCANNER
    // =================================================

    let scanner = null;

    let scannerRunning = false;


    // =================================================
    // QR YANG SEDANG DIPROSES
    // =================================================
    //
    // Bukan cooldown berdasarkan waktu.
    //
    // QR dikunci selama request ke server
    // masih berlangsung.
    //

    let processingIds =
      new Set();


    // =================================================
    // RIWAYAT
    // =================================================

    let historyData = [];


    // =================================================
    // AUDIO
    // =================================================

    let audioContext = null;


    // =================================================
    // PREPARE AUDIO
    // =================================================

    function prepareAudio() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }

      } catch (error) {

        console.log(
          "Audio tidak tersedia:",
          error
        );

      }

    }


    // =================================================
    // BEEP
    // =================================================

    function beep() {

      try {

        if (!audioContext) {

          prepareAudio();

        }


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.type =
          "sine";


        oscillator.frequency.value =
          880;


        gain.gain.value =
          0.15;


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.start();


        setTimeout(

          () => {

            oscillator.stop();

          },

          120

        );

      } catch (error) {

        console.log(
          "Beep gagal:",
          error
        );

      }

    }


    // =================================================
    // START SCANNER
    // =================================================

    async function startScanner() {

      prepareAudio();


      if (scannerRunning) {

        return;

      }


      const cameraStatus =
        document.getElementById(
          "cameraStatus"
        );


      try {

        cameraStatus.textContent =
          "Memulai kamera...";


        scanner =
          new Html5Qrcode(
            "reader"
          );


        const config = {

          fps:
            CAMERA_FPS,

          qrbox: {

            width:
              QR_BOX_SIZE,

            height:
              QR_BOX_SIZE

          },

          aspectRatio:
            1.0,

          disableFlip:
            true

        };


        await scanner.start(

          {
            facingMode:
              "environment"
          },

          config,

          onScanSuccess,

          onScanFailure

        );


        scannerRunning =
          true;


        document
          .getElementById(
            "startButton"
          )
          .disabled = true;


        document
          .getElementById(
            "stopButton"
          )
          .disabled = false;


        cameraStatus.textContent =
          "🟢 Kamera aktif — arahkan ke QR siswa.";


      } catch (error) {

        console.error(
          "Kamera gagal:",
          error
        );


        scannerRunning =
          false;


        cameraStatus.textContent =
          "🔴 Kamera tidak dapat digunakan.";


        showResult(

          "error",

          "✕ KAMERA GAGAL",

          "",

          `
            Pastikan izin kamera
            diberikan kepada browser.
          `

        );

      }

    }


    // =================================================
    // STOP SCANNER
    // =================================================

    async function stopScanner() {

      if (!scanner) {

        return;

      }


      try {

        await scanner.stop();

        scanner.clear();

      } catch (error) {

        console.log(
          "Stop scanner:",
          error
        );

      }


      scanner =
        null;


      scannerRunning =
        false;


      document
        .getElementById(
          "startButton"
        )
        .disabled = false;


      document
        .getElementById(
          "stopButton"
        )
        .disabled = true;


      document
        .getElementById(
          "cameraStatus"
        )
        .textContent =
        "Kamera berhenti.";

    }


    // =================================================
    // QR BERHASIL DIBACA
    // =================================================

    function onScanSuccess(

      decodedText,
      decodedResult

    ) {

      const idSiswa =
        String(
          decodedText || ""
        )
          .trim()
          .toUpperCase();


      if (!idSiswa) {

        return;

      }


      // =================================================
      // CEK APAKAH QR SEDANG DIPROSES
      // =================================================

      if (
        processingIds.has(
          idSiswa
        )
      ) {

        return;

      }


      // =================================================
      // KUNCI QR
      // =================================================

      processingIds.add(
        idSiswa
      );


      // =================================================
      // BEEP HANYA SEKALI
      // =================================================

      beep();


      // =================================================
      // TAMPILKAN PROSES
      // =================================================

      showProcessing(
        idSiswa
      );


      // =================================================
      // KIRIM KE SERVER
      // =================================================

      kirimPresensi(
        idSiswa
      );

    }


    // =================================================
    // SCAN FAILURE
    // =================================================

    function onScanFailure(
      errorMessage
    ) {

      // Tidak melakukan apa-apa.
      // Kamera terus melakukan scan.

    }


    // =================================================
    // KIRIM PRESENSI
    // =================================================

    async function kirimPresensi(
      idSiswa
    ) {

      const sesi =
        document
          .getElementById(
            "sesi"
          )
          .value;


      try {

        const response =
          await fetch(

            API_URL,

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  idSiswa:
                    idSiswa,

                  sesi:
                    sesi

                })

            }

          );


        const result =
          await response.json();


        console.log(
          "API:",
          result
        );


        // =================================================
        // HADIR
        // =================================================

        if (

          result.success ===
            true &&

          result.code ===
            "SUCCESS"

        ) {

          showResult(

            "success",

            "✓ HADIR",

            result.nama,

            `
              ID: ${result.idSiswa}<br>
              Sesi: ${result.sesi}<br>
              Waktu: ${result.waktu}
            `

          );


          addHistory(

            result.nama,

            result.idSiswa,

            result.sesi,

            result.waktu,

            "HADIR"

          );


          return;

        }


        // =================================================
        // SUDAH PRESENSI
        // =================================================

        if (

          result.code ===
          "ALREADY_PRESENT"

        ) {

          showResult(

            "warning",

            "⚠ SUDAH PRESENSI",

            result.nama,

            `
              ID: ${result.idSiswa}<br>
              Sesi: ${result.sesi}<br>
              Sudah tercatat pukul:
              ${result.waktu}
            `

          );


          addHistory(

            result.nama,

            result.idSiswa,

            result.sesi,

            result.waktu,

            "SUDAH"

          );


          return;

        }


        // =================================================
        // QR TIDAK TERDAFTAR
        // =================================================

        if (

          result.code ===
          "NOT_REGISTERED"

        ) {

          showResult(

            "error",

            "✕ QR TIDAK TERDAFTAR",

            "",

            `
              ID:
              ${result.idSiswa}
            `

          );


          addHistory(

            "QR tidak terdaftar",

            result.idSiswa,

            sesi,

            "-",

            "DITOLAK"

          );


          return;

        }


        // =================================================
        // TIDAK AKTIF
        // =================================================

        if (

          result.code ===
          "INACTIVE"

        ) {

          showResult(

            "error",

            "✕ SISWA TIDAK AKTIF",

            result.nama || "",

            `
              ID:
              ${result.idSiswa}
            `

          );


          addHistory(

            result.nama ||
            "Siswa tidak aktif",

            result.idSiswa,

            sesi,

            "-",

            "DITOLAK"

          );


          return;

        }


        // =================================================
        // ERROR LAIN
        // =================================================

        showResult(

          "error",

          "✕ TERJADI KESALAHAN",

          "",

          result.message ||
          "Server memberikan respons yang tidak dikenali."

        );


      } catch (error) {

        console.error(
          "API error:",
          error
        );


        showResult(

          "error",

          "✕ KONEKSI GAGAL",

          "",

          `
            Tidak dapat menghubungi
            server presensi.
          `

        );

      }


      finally {

        // =================================================
        // BUKA KUNCI QR
        // =================================================

        processingIds.delete(
          idSiswa
        );

      }

    }


    // =================================================
    // TAMPILKAN PROCESSING
    // =================================================

    function showProcessing(
      idSiswa
    ) {

      showResult(

        "processing",

        "⏳ MEMPROSES",

        idSiswa,

        `
          <div class="spinner"></div>
          QR terbaca.<br>
          Mengirim data presensi...
        `

      );

    }


    // =================================================
    // TAMPILKAN HASIL
    // =================================================

    function showResult(

      type,

      status,

      name,

      detail

    ) {

      const result =
        document.getElementById(
          "result"
        );


      const resultStatus =
        document.getElementById(
          "resultStatus"
        );


      const resultName =
        document.getElementById(
          "resultName"
        );


      const resultDetail =
        document.getElementById(
          "resultDetail"
        );


      result.className =
        "result " +
        type;


      resultStatus.textContent =
        status;


      resultName.textContent =
        name;


      resultDetail.innerHTML =
        detail;


      result.style.display =
        "block";


      // =================================================
      // HASIL BERTAHAN 5 DETIK
      // =================================================

      clearTimeout(
        window.resultTimer
      );


      window.resultTimer =
        setTimeout(

          () => {

            result.style.display =
              "none";

          },

          5000

        );

    }


    // =================================================
    // TAMBAH RIWAYAT
    // =================================================

    function addHistory(

      nama,

      id,

      sesi,

      waktu,

      status

    ) {

      historyData.unshift({

        nama:
          nama,

        id:
          id,

        sesi:
          sesi,

        waktu:
          waktu,

        status:
          status

      });


      // =================================================
      // MAKSIMAL 10 RIWAYAT
      // =================================================

      if (
        historyData.length >
        10
      ) {

        historyData =
          historyData.slice(
            0,
            10
          );

      }


      renderHistory();

    }


    // =================================================
    // RENDER RIWAYAT
    // =================================================

    function renderHistory() {

      const container =
        document.getElementById(
          "history"
        );


      if (
        historyData.length ===
        0
      ) {

        container.innerHTML = `

          <div class="history-empty">

            Belum ada scan.

          </div>

        `;

        return;

      }


      container.innerHTML =
        historyData
          .map(

            (item, index) => {

              return `

                <div class="history-item">

                  <div
                    class="history-number"
                  >
                    ${index + 1}
                  </div>


                  <div
                    class="history-info"
                  >

                    <div
                      class="history-name"
                    >
                      ${escapeHtml(
                        item.nama
                      )}
                    </div>


                    <div
                      class="history-detail"
                    >
                      ${escapeHtml(
                        item.id
                      )}
                      ·
                      ${escapeHtml(
                        item.sesi
                      )}
                      ·
                      ${escapeHtml(
                        item.waktu
                      )}
                    </div>

                  </div>


                  <div
                    class="history-status"
                  >
                    ${escapeHtml(
                      item.status
                    )}
                  </div>

                </div>

              `;

            }

          )
          .join("");

    }


    // =================================================
    // ESCAPE HTML
    // =================================================

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text == null
          ? ""
          : String(text);


      return div.innerHTML;

    }


    // =================================================
    // CEGAH GANTI SESI SAAT KAMERA AKTIF
    // =================================================

    let sesiSebelumnya =
      document
        .getElementById(
          "sesi"
        )
        .value;


    document
      .getElementById(
        "sesi"
      )
      .addEventListener(

        "change",

        function () {

          if (
            scannerRunning
          ) {

            alert(
              "Hentikan kamera terlebih dahulu sebelum mengganti sesi."
            );


            this.value =
              sesiSebelumnya;


            return;

          }


          sesiSebelumnya =
            this.value;

        }

      );


  </script>

</body>

</html>
