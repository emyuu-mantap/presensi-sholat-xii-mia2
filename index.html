  <style>

  <script>


    // =====================================================
    // URL APPS SCRIPT
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbzdYWzw0WAKHSfkwiOEiCppd2KLl2pmWoSFkyzSIhEOaRiKlEapUsC_RU3IWH8efnC_Zg/exec";


    // =====================================================
    // KONFIGURASI SCANNER
    // =====================================================

    const CAMERA_FPS = 15;

    const QR_BOX_SIZE = 250;


    // =====================================================
    // DATA 31 SISWA
    // =====================================================

    const STUDENTS = {

      "MIA2-001":
        "AFRIA DIKKY HIDAYAT",

      "MIA2-002":
        "AHMAD PIANOR",

      "MIA2-003":
        "ALDI SAPUTRA",

      "MIA2-004":
        "DEWI ARIANTI",

      "MIA2-005":
        "DINAR NAZARIA PUTERI",

      "MIA2-006":
        "DZAKIRA IFTINAH ZALFA",

      "MIA2-007":
        "EKA PUTRI KHOLIFIA",

      "MIA2-008":
        "HASBILAH",

      "MIA2-009":
        "HUSNUL ASHFIA",

      "MIA2-010":
        "JUMIATUN NIRMALA",

      "MIA2-011":
        "KEYZA PUTRI RAMADHANI",

      "MIA2-012":
        "LUTHFI NUR AHMADI A",

      "MIA2-013":
        "MAHMUDAH",

      "MIA2-014":
        "MARDIANA",

      "MIA2-015":
        "MARSHALINA",

      "MIA2-016":
        "MUHAMMAD FADHIL AL LAIL",

      "MIA2-017":
        "MUHAMMAD MARVEL",

      "MIA2-018":
        "NAFISA ADDAWIYAH",

      "MIA2-019":
        "NENG KHOIRIYA RAMADHANI",

      "MIA2-020":
        "NOOR SYIFA",

      "MIA2-021":
        "NOR ANISSA",

      "MIA2-022":
        "NOVIKA MARDIANA",

      "MIA2-023":
        "RAFFI AKHMAD",

      "MIA2-024":
        "RIFA ALYA MAYYADAH",

      "MIA2-025":
        "RIHHADATUL AISYAH",

      "MIA2-026":
        "SALEHAH",

      "MIA2-027":
        "SHEPYA NOVITA DILA RESTU",

      "MIA2-028":
        "SITI UMROH NUR HAYATI",

      "MIA2-029":
        "TASYA NOR AZIZAH",

      "MIA2-030":
        "YUSUF AL AMIEN",

      "MIA2-031":
        "ZAHRATUSSYIFA"

    };


    // =====================================================
    // VARIABEL
    // =====================================================

    let scanner = null;

    let scannerRunning = false;


    // =====================================================
    // KUNCI PRESENSI
    //
    // Format:
    //
    // DZUHUR|MIA2-001
    // ASHAR|MIA2-001
    //
    // Jadi DZUHUR dan ASHAR terpisah.
    // =====================================================

    const completedKeys =
      new Set();


    // =====================================================
    // REQUEST YANG SEDANG BERJALAN
    // =====================================================

    const pendingKeys =
      new Set();


    // =====================================================
    // RIWAYAT
    // =====================================================

    let historyData = [];


    // =====================================================
    // AUDIO
    // =====================================================

    let audioContext = null;


    // =====================================================
    // HASIL TIMER
    // =====================================================

    let resultTimer = null;


    // =====================================================
    // SESSION TERAKHIR
    // =====================================================

    let sesiSebelumnya =
      document
        .getElementById("sesi")
        .value;


    // =====================================================
    // PREPARE AUDIO
    // =====================================================

    function prepareAudio() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }

      }

      catch (error) {

        console.log(
          "Audio tidak tersedia:",
          error
        );

      }

    }


    // =====================================================
    // BEEP
    // =====================================================

    function beep() {

      try {

        if (!audioContext) {

          prepareAudio();

        }


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.type =
          "sine";


        oscillator.frequency.value =
          880;


        gain.gain.value =
          0.15;


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.start();


        setTimeout(

          () => {

            oscillator.stop();

          },

          120

        );

      }

      catch (error) {

        console.log(
          "Beep gagal:",
          error
        );

      }

    }


    // =====================================================
    // MULAI SCANNER
    // =====================================================

    async function startScanner() {

      prepareAudio();


      if (scannerRunning) {

        return;

      }


      const cameraStatus =
        document
          .getElementById(
            "cameraStatus"
          );


      try {

        cameraStatus.textContent =
          "Memulai kamera...";


        scanner =
          new Html5Qrcode(
            "reader"
          );


        const config = {

          fps:
            CAMERA_FPS,

          qrbox: {

            width:
              QR_BOX_SIZE,

            height:
              QR_BOX_SIZE

          },

          aspectRatio:
            1.0,

          disableFlip:
            true

        };


        await scanner.start(

          {
            facingMode:
              "environment"
          },

          config,

          onScanSuccess,

          onScanFailure

        );


        scannerRunning =
          true;


        document
          .getElementById(
            "startButton"
          )
          .disabled = true;


        document
          .getElementById(
            "stopButton"
          )
          .disabled = false;


        cameraStatus.textContent =
          "🟢 Kamera aktif — arahkan ke QR siswa.";

      }

      catch (error) {

        console.error(
          "Kamera gagal:",
          error
        );


        scannerRunning =
          false;


        cameraStatus.textContent =
          "🔴 Kamera tidak dapat digunakan.";


        showResult(

          "error",

          "✕ KAMERA GAGAL",

          "",

          "Pastikan izin kamera diberikan kepada browser."

        );

      }

    }


    // =====================================================
    // STOP SCANNER
    // =====================================================

    async function stopScanner() {

      if (!scanner) {

        return;

      }


      try {

        await scanner.stop();

        scanner.clear();

      }

      catch (error) {

        console.log(
          "Stop scanner:",
          error
        );

      }


      scanner =
        null;


      scannerRunning =
        false;


      document
        .getElementById(
          "startButton"
        )
        .disabled = false;


      document
        .getElementById(
          "stopButton"
        )
        .disabled = true;


      document
        .getElementById(
          "cameraStatus"
        )
        .textContent =
        "Kamera berhenti.";

    }


    // =====================================================
    // QR BERHASIL DIBACA
    // =====================================================

    function onScanSuccess(

      decodedText,
      decodedResult

    ) {

      const idSiswa =
        String(
          decodedText || ""
        )
          .trim()
          .toUpperCase();


      if (!idSiswa) {

        return;

      }


      // ===================================================
      // PASTIKAN ID TERDAFTAR DI DATABASE LOKAL
      // ===================================================

      const nama =
        STUDENTS[idSiswa];


      if (!nama) {

        handleUnknownQR(
          idSiswa
        );

        return;

      }


      const sesi =
        document
          .getElementById(
            "sesi"
          )
          .value;


      const key =
        sesi +
        "|" +
        idSiswa;


      // ===================================================
      // SUDAH SELESAI / SUDAH DIPROSES
      // ===================================================

      if (
        completedKeys.has(
          key
        )
      ) {

        return;

      }


      // ===================================================
      // MASIH MENUNGGU SERVER
      // ===================================================

      if (
        pendingKeys.has(
          key
        )
      ) {

        return;

      }


      // ===================================================
      // KUNCI REQUEST
      // ===================================================

      pendingKeys.add(
        key
      );


      // ===================================================
      // BEEP SEGERA
      // =====================================================

      beep();


      // ===================================================
      // TAMPILKAN NAMA SEGERA
      // ===================================================

      showResult(

        "processing",

        "⏳ MENCATAT...",

        nama,

        `
          ID: ${idSiswa}<br>
          Sesi: ${sesi}<br>
          QR terbaca — mengirim ke server...
        `

      );


      // ===================================================
      // MASUKKAN KE RIWAYAT SEGERA
      // ===================================================

      const historyId =
        addHistory(

          nama,

          idSiswa,

          sesi,

          "Mencatat...",

          "MENCATAT"

        );


      // ===================================================
      // KIRIM KE APPS SCRIPT
      // ===================================================

      kirimPresensi(

        idSiswa,

        sesi,

        key,

        historyId

      );

    }


    // =====================================================
    // QR TIDAK DIKENAL
    // =====================================================

    let unknownLock =
      new Set();


    function handleUnknownQR(
      idSiswa
    ) {

      if (
        unknownLock.has(
          idSiswa
        )
      ) {

        return;

      }


      unknownLock.add(
        idSiswa
      );


      beep();


      showResult(

        "error",

        "✕ QR TIDAK TERDAFTAR",

        idSiswa,

        "QR ini tidak ditemukan dalam daftar 31 siswa."

      );


      setTimeout(

        () => {

          unknownLock.delete(
            idSiswa
          );

        },

        3000

      );

    }


    // =====================================================
    // SCAN FAILURE
    // =====================================================

    function onScanFailure(
      errorMessage
    ) {

      // Sengaja dikosongkan.
      //
      // Scanner terus mencoba membaca
      // frame kamera berikutnya.

    }


    // =====================================================
    // KIRIM PRESENSI
    // =====================================================

    async function kirimPresensi(

      idSiswa,

      sesi,

      key,

      historyId

    ) {

      try {

        const response =
          await fetch(

            API_URL,

            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify({

                  idSiswa:
                    idSiswa,

                  sesi:
                    sesi

                })

            }

          );


        const result =
          await response.json();


        console.log(
          "API RESPONSE:",
          result
        );


        // =================================================
        // BERHASIL HADIR
        // =================================================

        if (

          result.success ===
            true &&

          result.code ===
            "SUCCESS"

        ) {

          completedKeys.add(
            key
          );


          updateHistory(

            historyId,

            result.nama,

            result.idSiswa,

            result.sesi,

            result.waktu,

            "HADIR"

          );


          showResult(

            "success",

            "✓ HADIR",

            result.nama,

            `
              ID: ${result.idSiswa}<br>
              Sesi: ${result.sesi}<br>
              Waktu: ${result.waktu}
            `

          );


          return;

        }


        // =================================================
        // SUDAH PRESENSI
        // =================================================

        if (

          result.code ===
          "ALREADY_PRESENT"

        ) {

          completedKeys.add(
            key
          );


          updateHistory(

            historyId,

            result.nama,

            result.idSiswa,

            result.sesi,

            result.waktu,

            "SUDAH"

          );


          showResult(

            "warning",

            "⚠ SUDAH PRESENSI",

            result.nama,

            `
              ID: ${result.idSiswa}<br>
              Sesi: ${result.sesi}<br>
              Sudah tercatat pukul:
              ${result.waktu}
            `

          );


          return;

        }


        // =================================================
        // TIDAK TERDAFTAR DI SERVER
        // =================================================

        if (

          result.code ===
          "NOT_REGISTERED"

        ) {

          updateHistory(

            historyId,

            "QR tidak terdaftar",

            idSiswa,

            sesi,

            "-",

            "DITOLAK"

          );


          showResult(

            "error",

            "✕ QR TIDAK TERDAFTAR",

            idSiswa,

            "Server tidak menemukan ID siswa tersebut."

          );


          return;

        }


        // =================================================
        // SISWA TIDAK AKTIF
        // =================================================

        if (

          result.code ===
          "INACTIVE"

        ) {

          updateHistory(

            historyId,

            result.nama ||
              STUDENTS[idSiswa],

            idSiswa,

            sesi,

            "-",

            "DITOLAK"

          );


          showResult(

            "error",

            "✕ SISWA TIDAK AKTIF",

            result.nama ||
              STUDENTS[idSiswa],

            `
              ID:
              ${idSiswa}
            `

          );


          return;

        }


        // =================================================
        // ERROR LAIN
        // =================================================

        updateHistory(

          historyId,

          STUDENTS[idSiswa],

          idSiswa,

          sesi,

          "-",

          "ERROR"

        );


        showResult(

          "error",

          "✕ TERJADI KESALAHAN",

          STUDENTS[idSiswa],

          result.message ||
          "Server memberikan respons yang tidak dikenali."

        );

      }


      catch (error) {

        console.error(
          "API ERROR:",
          error
        );


        // ================================================
        // HAPUS LOCK
        //
        // Karena gagal, siswa boleh dicoba lagi.
        // ================================================

        updateHistory(

          historyId,

          STUDENTS[idSiswa],

          idSiswa,

          sesi,

          "-",

          "GAGAL"

        );


        showResult(

          "error",

          "✕ KONEKSI GAGAL",

          STUDENTS[idSiswa],

          `
            Data belum dapat dikonfirmasi
            oleh server.<br>
            Silakan scan ulang.
          `

        );

      }


      finally {

        // =================================================
        // REQUEST SELESAI
        // =================================================

        pendingKeys.delete(
          key
        );

      }

    }


    // =====================================================
    // HASIL SCAN
    // =====================================================

    function showResult(

      type,

      status,

      name,

      detail

    ) {

      const result =
        document
          .getElementById(
            "result"
          );


      const resultStatus =
        document
          .getElementById(
            "resultStatus"
          );


      const resultName =
        document
          .getElementById(
            "resultName"
          );


      const resultDetail =
        document
          .getElementById(
            "resultDetail"
          );


      result.className =
        "result " +
        type;


      resultStatus.textContent =
        status;


      resultName.textContent =
        name;


      resultDetail.innerHTML =
        detail;


      result.style.display =
        "block";


      clearTimeout(
        resultTimer
      );


      resultTimer =
        setTimeout(

          () => {

            result.style.display =
              "none";

          },

          5000

        );

    }


    // =====================================================
    // TAMBAH RIWAYAT
    // =====================================================

    function addHistory(

      nama,

      id,

      sesi,

      waktu,

      status

    ) {

      const item = {

        idHistory:
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2),

        nama:
          nama,

        id:
          id,

        sesi:
          sesi,

        waktu:
          waktu,

        status:
          status

      };


      historyData.unshift(
        item
      );


      if (
        historyData.length >
        10
      ) {

        historyData =
          historyData.slice(
            0,
            10
          );

      }


      renderHistory();


      return item.idHistory;

    }


    // =====================================================
    // UPDATE RIWAYAT
    // =====================================================

    function updateHistory(

      historyId,

      nama,

      id,

      sesi,

      waktu,

      status

    ) {

      const item =
        historyData.find(

          x =>
            x.idHistory ===
            historyId

        );


      if (!item) {

        return;

      }


      item.nama =
        nama;

      item.id =
        id;

      item.sesi =
        sesi;

      item.waktu =
        waktu;

      item.status =
        status;


      renderHistory();

    }


    // =====================================================
    // RENDER RIWAYAT
    // =====================================================

    function renderHistory() {

      const container =
        document
          .getElementById(
            "history"
          );


      if (
        historyData.length ===
        0
      ) {

        container.innerHTML = `

          <div class="history-empty">

            Belum ada scan.

          </div>

        `;

        return;

      }


      container.innerHTML =
        historyData
          .map(

            (item, index) => {

              return `

                <div
                  class="history-item"
                >

                  <div
                    class="history-number"
                  >

                    ${index + 1}

                  </div>


                  <div
                    class="history-info"
                  >

                    <div
                      class="history-name"
                    >

                      ${escapeHtml(
                        item.nama
                      )}

                    </div>


                    <div
                      class="history-detail"
                    >

                      ${escapeHtml(
                        item.id
                      )}

                      ·

                      ${escapeHtml(
                        item.sesi
                      )}

                      ·

                      ${escapeHtml(
                        item.waktu
                      )}

                    </div>

                  </div>


                  <div
                    class="history-status"
                  >

                    ${escapeHtml(
                      item.status
                    )}

                  </div>

                </div>

              `;

            }

          )
          .join("");

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text == null
          ? ""
          : String(text);


      return div.innerHTML;

    }


    // =====================================================
    // GANTI SESI
    // =====================================================

    document
      .getElementById(
        "sesi"
      )
      .addEventListener(

        "change",

        function () {

          if (
            scannerRunning
          ) {

            alert(
              "Hentikan kamera terlebih dahulu sebelum mengganti sesi."
            );


            this.value =
              sesiSebelumnya;


            return;

          }


          sesiSebelumnya =
            this.value;

        }

      );


  </script>
